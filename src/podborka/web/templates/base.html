<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Podborka{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">podborka</a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Сводка</a>
      <a href="/items" {% if path.startswith('/items') %}aria-current="page"{% endif %}>Лента</a>
      <a href="/queries" {% if path.startswith('/queries') %}aria-current="page"{% endif %}>Товары</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
