{% extends "base.html" %}
{% block title %}Лента — Podborka{% endblock %}
{% block content %}
<h1>Лента</h1>
<form class="filters" hx-get="/items" hx-target="#feed" hx-trigger="change" hx-push-url="true">
  <label>Товар
    <select name="query_id">
      <option value="">Все</option>
      {% for q in queries %}
      <option value="{{ q.id }}" {% if f.query_id == q.id|string %}selected{% endif %}>{{ q.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Соцсеть
    <select name="platform">
      <option value="">Все</option>
      {% for p in Platform %}
      <option value="{{ p }}" {% if f.platform == p %}selected{% endif %}>{{ PLATFORM_LABELS[p] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Тип
    <select name="content_type">
      <option value="">Все</option>
      {% for c in ContentType %}
      <option value="{{ c }}" {% if f.content_type == c %}selected{% endif %}>{{ CONTENT_LABELS[c] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Период
    <select name="period">
      {% for k, v in PERIOD_LABELS.items() %}
      <option value="{{ k }}" {% if f.period == k %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Сортировка
    <select name="sort">
      {% for k, v in SORT_LABELS.items() %}
      <option value="{{ k }}" {% if f.sort == k %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
  </label>
  <noscript><button type="submit">Показать</button></noscript>
</form>
<div id="feed">{% include "_feed.html" %}</div>
{% endblock %}
